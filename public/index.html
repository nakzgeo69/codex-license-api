<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEX Admin Panel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container, .keys-container {
            width: 100%;
            max-width: 600px;
        }
        .container {
            background-color: #1a1a24;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid #2d2d3d;
            margin-bottom: 20px;
        }
        h2 {
            text-align: center;
            color: #a855f7;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-size: 20px;
        }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #a0a0b0; font-weight: 600; }
        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; }
        input, select, button {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background-color: #0f0f13; color: #fff; font-size: 14px; outline: none;
        }
        input:focus, select:focus { border-color: #a855f7; }
        button.main-btn {
            background-color: #a855f7; color: white; font-weight: bold;
            cursor: pointer; border: none; margin-top: 10px;
        }
        button.main-btn:hover { background-color: #9333ea; }
        
        /* Listahan ng Keys */
        .key-card {
            background-color: #1a1a24; border: 1px solid #2d2d3d;
            border-radius: 8px; padding: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .key-info { display: flex; flex-direction: column; gap: 5px; }
        .key-name { font-family: monospace; color: #4ade80; font-size: 16px; font-weight: bold; }
        .key-status-text { font-size: 12px; color: #888; }
        
        .action-buttons { display: flex; gap: 8px; }
        .btn-icon {
            width: 35px; height: 35px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 16px; display: flex;
            justify-content: center; align-items: center;
        }
        .btn-pause { background-color: #f59e0b; color: white; }
        .btn-resume { background-color: #10b981; color: white; }
        .btn-delete { background-color: #ef4444; color: white; }
        .btn-icon:hover { opacity: 0.8; }

        /* Details Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background-color: #1a1a24; padding: 25px; border-radius: 12px;
            width: 90%; max-width: 400px; border: 1px solid #a855f7;
        }
        .modal-content p { margin: 10px 0; font-size: 14px; border-bottom: 1px solid #333; padding-bottom: 5px;}
        .modal-content span { float: right; font-weight: bold; }
        .close-btn { background-color: #ef4444; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Codex Admin Panel</h2>
    
    <div class="input-group">
        <label>Admin Password</label>
        <input type="password" id="adminPass" placeholder="Enter password...">
    </div>

    <div class="input-group">
        <label>Time Expiry</label>
        <div class="row">
            <input type="number" id="duration" value="1" min="1">
            <select id="unit">
                <option value="seconds">Seconds</option>
                <option value="minutes" selected>Minutes</option>
                <option value="hours">Hours</option>
                <option value="days">Days</option>
                <option value="months">Months</option>
                <option value="years">Years</option>
            </select>
        </div>
    </div>

    <button class="main-btn" onclick="generateKey()">Generate Key</button>
</div>

<div class="keys-container" id="keysList"></div>

<div class="modal" id="detailsModal">
    <div class="modal-content">
        <h2 style="font-size:16px;">Key Details</h2>
        <p>Status: <span id="dStatus"></span></p>
        <p>HWID: <span id="dHwid" style="font-size:10px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;"></span></p>
        <p>Valid For: <span id="dValid"></span></p>
        <p>Time Left: <span id="dTimeLeft"></span></p>
        <button class="main-btn close-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    let timerInterval = null;

    async function generateKey() {
        const pass = document.getElementById('adminPass').value;
        const duration = document.getElementById('duration').value;
        const unit = document.getElementById('unit').value;
        if (!pass) return alert("Enter Password!");

        const res = await fetch(`/generate?password=${pass}&duration=${duration}&unit=${unit}`);
        const data = await res.json();
        if (data.status === "success") loadKeys();
        else alert(data.message);
    }

    async function loadKeys() {
        const pass = document.getElementById('adminPass').value;
        if (!pass) return;

        const res = await fetch(`/list?password=${pass}`);
        const data = await res.json();
        const container = document.getElementById('keysList');
        container.innerHTML = "";

        if (Object.keys(data).length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#888;'>No keys generated yet.</p>";
            return;
        }

        const keys = Object.keys(data).reverse();
        
        keys.forEach(k => {
            const keyData = data[k];
            const card = document.createElement('div');
            card.className = 'key-card';
            
            // Determine Icon based on status
            let pauseIcon = "▶️";
            let pauseClass = "btn-resume";
            if (keyData.status === "ACTIVE") {
                pauseIcon = "⏸️";
                pauseClass = "btn-pause";
            }

            card.innerHTML = `
                <div class="key-info" onclick="viewKey('${k}')" style="cursor:pointer;">
                    <span class="key-name">${k}</span>
                    <span class="key-status-text">Status: ${keyData.status}</span>
                </div>
                <div class="action-buttons">
                    <button class="btn-icon ${pauseClass}" onclick="togglePause('${k}')">${pauseIcon}</button>
                    <button class="btn-icon btn-delete" onclick="deleteKey('${k}')">🗑️</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function togglePause(key) {
        const pass = document.getElementById('adminPass').value;
        const res = await fetch(`/toggle-pause?password=${pass}&key=${key}`);
        const data = await res.json();
        alert(data.message);
        loadKeys(); // I-reload ang UI
    }

    async function deleteKey(key) {
        if (!confirm("Are you sure you want to delete this key?")) return;
        const pass = document.getElementById('adminPass').value;
        const res = await fetch(`/delete?password=${pass}&key=${key}`);
        const data = await res.json();
        alert(data.message);
        loadKeys(); // I-reload ang UI
    }

    async function viewKey(key) {
        const pass = document.getElementById('adminPass').value;
        const res = await fetch(`/check?password=${pass}&key=${key}`);
        const data = await res.json();

        document.getElementById('dStatus').innerText = data.status;
        document.getElementById('dStatus').style.color = data.status === 'ACTIVE' ? '#4ade80' : (data.status === 'PAUSED' ? '#f59e0b' : '#fbbf24');
        document.getElementById('dHwid').innerText = data.hwid;
        document.getElementById('dValid').innerText = `${data.duration} ${data.unit}`;
        
        if (timerInterval) clearInterval(timerInterval);
        const timeLeftEl = document.getElementById('dTimeLeft');
        
        function updateTimer() {
            if (data.status === "UNUSED" || data.status === "PAUSED") {
                let msg = data.status === "UNUSED" ? "Waiting for first use..." : "PAUSED";
                timeLeftEl.innerText = msg;
                timeLeftEl.style.color = "#f59e0b";
                clearInterval(timerInterval);
                return;
            }
            if (data.timeLeftMs <= 0) {
                timeLeftEl.innerText = "EXPIRED";
                timeLeftEl.style.color = "#ef4444";
                clearInterval(timerInterval);
                return;
            }

            let totalSec = Math.floor(data.timeLeftMs / 1000);
            let d = Math.floor(totalSec / (3600 * 24));
            let h = Math.floor((totalSec % (3600 * 24)) / 3600);
            let m = Math.floor((totalSec % 3600) / 60);
            let s = totalSec % 60;

            timeLeftEl.innerText = `${d}d ${h}h ${m}m ${s}s`;
            timeLeftEl.style.color = "#4ade80";
            data.timeLeftMs -= 1000;
        }
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
        document.getElementById('detailsModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detailsModal').style.display = 'none';
        clearInterval(timerInterval);
    }

    document.getElementById('adminPass').addEventListener('input', () => {
        if(document.getElementById('adminPass').value.length > 3) loadKeys();
    });
</script>

</body>
</html>
