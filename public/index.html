<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEX Admin Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap');
        * { box-sizing: border-box; }
        body {
            background-color: #050505; background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #050505 70%);
            color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .navbar { position: fixed; top: 0; width: 100%; padding: 15px 20px; display: flex; justify-content: flex-start; }
        .logo-text { font-family: 'Orbitron', sans-serif; font-size: 18px; color: #a855f7; margin: 0; letter-spacing: 2px; text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
        
        .login-container { width: 100%; max-width: 350px; display: flex; flex-direction: column; align-items: center; text-align: center; animation: fadeIn 0.8s ease-out; }
        .lock-icon-box { width: 70px; height: 70px; background: linear-gradient(135deg, #a855f7, #6b21a8); border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 30px; margin-bottom: 20px; box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); border: 1px solid rgba(255,255,255,0.2); }
        .title { font-family: 'Orbitron', sans-serif; font-size: 24px; margin: 0 0 30px 0; letter-spacing: 2px; }
        .title span { color: #a855f7; }
        
        .form-box { background: rgba(15, 15, 23, 0.7); backdrop-filter: blur(10px); padding: 25px; border-radius: 16px; width: 100%; border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); margin-bottom: 20px; }
        
        input { 
            width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #333; 
            background-color: #050505; color: #fff; font-size: 14px; outline: none; 
            margin-bottom: 15px; transition: 0.3s; font-family: 'Inter', sans-serif; 
            text-align: center; letter-spacing: 2px; 
        }
        input:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
        
        .sign-in-btn { background: linear-gradient(to right, #a855f7, #3b82f6); color: white; border: none; border-radius: 8px; padding: 15px; font-size: 16px; font-family: 'Orbitron', sans-serif; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); transition: 0.3s; letter-spacing: 1px; }
        .sign-in-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(168, 85, 247, 0.8); }
        
        .footer-text { font-size: 11px; color: #888; margin-top: 10px; }
        .footer-text span { color: #a855f7; cursor: pointer; }
        
        #adminPanel { display: none; width: 100%; max-width: 500px; padding: 20px; animation: fadeIn 0.5s; }
        .admin-form-box { background: rgba(15,15,23,0.8); backdrop-filter: blur(10px); padding: 20px; border-radius: 12px; border: 1px solid #a855f7; box-shadow: 0 0 30px rgba(168, 85, 247, 0.2); margin-bottom: 20px; }
        
        .expiry-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .expiry-row input, .expiry-row select { flex: 1; margin-bottom: 0; }
        select { width: 100%; padding: 14px; border-radius: 8px; background: #050505; color: #fff; border: 1px solid #333; outline: none; text-align: center; font-family: 'Inter', sans-serif; }
        select:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.3); }
        .label-text { display: block; margin-bottom: 8px; font-size: 13px; color: #a0a0b0; text-align: left; }
        
        .keys-container { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .key-card { background: rgba(15,15,23,0.8); border: 1px solid #2d2d3d; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .card-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .card-header:hover { background-color: #1a1a24; }
        .card-left { display: flex; flex-direction: column; flex: 1; }
        .key-index { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 2px; }
        .key-name { font-family: monospace; color: #4ade80; font-size: 14px; font-weight: bold; text-shadow: 0 0 5px rgba(74, 222, 128, 0.5); }
        .card-right { display: flex; align-items: center; gap: 8px; }
        .status-badge { font-size: 10px; padding: 4px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; min-width: 60px; text-align: center; }
        .status-UNUSED { background-color: #fbbf24; color: #000; }
        .status-ACTIVE { background-color: #4ade80; color: #000; }
        .status-PAUSED { background-color: #f59e0b; color: #000; }
        .btn-icon { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; justify-content: center; align-items: center; padding: 0; }
        .btn-pause { background-color: #f59e0b; color: white; }
        .btn-resume { background-color: #10b981; color: white; }
        .btn-delete { background-color: #ef4444; color: white; }
        .arrow-box { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; color: #888; font-size: 12px; cursor: pointer; transition: 0.3s; }
        .arrow-box.down { transform: rotate(180deg); }
        .card-body { display: none; padding: 15px; background-color: #0a0a0f; border-top: 1px solid #2d2d3d; font-size: 13px; color: #ccc; }
        .card-body.active { display: block; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px dashed #333; }
        .detail-row:last-child { border-bottom: none; }
        .detail-row span:first-child { color: #a0a0b0; }
        .detail-row span:last-child { font-weight: bold; color: #fff; text-align: right; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="navbar"><h1 class="logo-text">CODEX MLBB</h1></div>

    <div class="login-container" id="loginScreen">
        <div class="lock-icon-box"><i class="fas fa-lock" style="color: white;"></i></div>
        <h1 class="title">ADMIN <span>LOGIN</span></h1>
        <div class="form-box">
            <input type="password" id="adminPass" placeholder="Enter Admin Password">
            <button class="sign-in-btn" onclick="login()">SIGN IN</button>
        </div>
        <p class="footer-text">Need access? Contact <span>GeoDevs69</span></p>
    </div>

    <div id="adminPanel">
        <div class="admin-form-box">
            <label class="label-text">Time Expiry</label>
            <div class="expiry-row">
                <input type="number" id="duration" value="1" min="1">
                <select id="unit">
                    <option value="seconds">Seconds</option>
                    <option value="minutes" selected>Minutes</option>
                    <option value="hours">Hours</option>
                    <option value="days">Days</option>
                    <option value="months">Months</option>
                    <option value="years">Years</option>
                </select>
            </div>
            <button class="sign-in-btn" onclick="generateKey()">GENERATE KEY</button>
        </div>
        <div class="keys-container" id="keysList"></div>
    </div>

<script>
    const part1 = "37db3323"; 
    const part2 = "8d80fe0d"; 
    const part3 = "65e6e84c4e65c74cbb9f4b1d"; 
    const SECRET_HASH = part1 + part2 + part3;

    async function sha1(message) {
        const msgBuffer = new TextEncoder().encode(message);                    
        const hashBuffer = await crypto.subtle.digest('SHA-1', msgBuffer);     
        const hashArray = Array.from(new Uint8Array(hashBuffer));              
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
    }

    async function login() {
        const pass = document.getElementById('adminPass').value;
        const hashedInput = await sha1(pass);

        // Ikukumpara sa pinagdudugtong na hash
        if (hashedInput === SECRET_HASH) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadKeys();
        } else {
            alert("❌ Invalid Password!");
        }
    }

    let timerIntervals = {};

    async function generateKey() {
        const pass = document.getElementById('adminPass').value;
        const duration = document.getElementById('duration').value;
        const unit = document.getElementById('unit').value;

        const res = await fetch(`/generate?password=${pass}&duration=${duration}&unit=${unit}`);
        const data = await res.json();
        if (data.status === "success") loadKeys();
        else alert(data.message);
    }

    async function loadKeys() {
        const pass = document.getElementById('adminPass').value;
        if (!pass) return;

        for (let key in timerIntervals) clearInterval(timerIntervals[key]);
        timerIntervals = {};

        const res = await fetch(`/list?password=${pass}`);
        const data = await res.json();
        const container = document.getElementById('keysList');
        container.innerHTML = "";

        if (Object.keys(data).length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#888;'>No keys generated yet.</p>";
            return;
        }

        const sortedKeys = Object.keys(data).sort((a, b) => data[a].createdAt - data[b].createdAt);
        let indexCounter = 1;

        sortedKeys.forEach(k => {
            const keyData = data[k];
            const card = document.createElement('div');
            card.className = 'key-card';
            
            let pauseIcon = "▶️", pauseClass = "btn-resume";
            if (keyData.status === "ACTIVE") { pauseIcon = "⏸️"; pauseClass = "btn-pause"; }

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-left" onclick="toggleDetails('${k}')">
                        <span class="key-index">Key #${indexCounter}</span>
                        <span class="key-name">${k}</span>
                    </div>
                    <div class="card-right">
                        <span class="status-badge status-${keyData.status}">${keyData.status}</span>
                        <button class="btn-icon ${pauseClass}" onclick="togglePause('${k}')">${pauseIcon}</button>
                        <button class="btn-icon btn-delete" onclick="deleteKey('${k}')">🗑️</button>
                        <div class="arrow-box" id="arrow-${k}" onclick="toggleDetails('${k}')">▼</div>
                    </div>
                </div>
                <div class="card-body" id="body-${k}">
                    <div class="detail-row"><span>Time Valid:</span> <span>${keyData.duration} ${keyData.unit}</span></div>
                    <div class="detail-row"><span>HWID:</span> <span id="hwid-${k}" style="font-size:10px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${keyData.hwid}</span></div>
                    <div class="detail-row"><span>Expires At:</span> <span id="exp-${k}">${keyData.expires ? new Date(keyData.expires).toLocaleString() : 'Not Started'}</span></div>
                    <div class="detail-row" style="color:#4ade80; font-size:15px; margin-top:10px;">
                        <span>Time Left:</span> <span id="time-${k}">Calculating...</span>
                    </div>
                </div>
            `;
            container.appendChild(card);
            indexCounter++;
        });

        sortedKeys.forEach(k => startTimer(k, data[k]));
    }

    function toggleDetails(key) {
        const body = document.getElementById(`body-${key}`);
        const arrow = document.getElementById(`arrow-${key}`);
        body.classList.toggle('active');
        arrow.classList.toggle('down');
    }

    async function togglePause(key) {
        const pass = document.getElementById('adminPass').value;
        const res = await fetch(`/toggle-pause?password=${pass}&key=${key}`);
        const data = await res.json();
        alert(data.message);
        loadKeys(); 
    }

    async function deleteKey(key) {
        if (!confirm("Are you sure you want to delete this key?")) return;
        const pass = document.getElementById('adminPass').value;
        const res = await fetch(`/delete?password=${pass}&key=${key}`);
        const data = await res.json();
        alert(data.message);
        loadKeys(); 
    }

    function startTimer(key, keyData) {
        const timeEl = document.getElementById(`time-${key}`);
        if (!timeEl) return;

        if (keyData.status === "UNUSED") {
            timeEl.innerText = "Waiting for first use";
            timeEl.style.color = "#fbbf24";
            return;
        }
        if (keyData.status === "PAUSED") {
            timeEl.innerText = "ON HOLD (Paused)";
            timeEl.style.color = "#f59e0b";
            return;
        }

        let timeLeftMs = new Date(keyData.expires) - new Date();
        
        timerIntervals[key] = setInterval(() => {
            if (timeLeftMs <= 0) {
                timeEl.innerText = "EXPIRED";
                timeEl.style.color = "#ef4444";
                clearInterval(timerIntervals[key]);
                return;
            }
            let totalSec = Math.floor(timeLeftMs / 1000);
            let d = Math.floor(totalSec / (3600 * 24));
            let h = Math.floor((totalSec % (3600 * 24)) / 3600);
            let m = Math.floor((totalSec % 3600) / 60);
            let s = totalSec % 60;
            timeEl.innerText = `${d}d ${h}h ${m}m ${s}s`;
            timeEl.style.color = "#4ade80";
            timeLeftMs -= 1000;
        }, 1000);
    }
</script>
</body>
</html>
